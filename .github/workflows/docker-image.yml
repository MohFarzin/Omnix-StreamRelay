name: Docker image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR package names must be lowercase
  IMAGE_NAME: mohfarzin/omnix-streamrelay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prefer a classic PAT (write:packages) when the package already exists and is
      # not linked to this repo. Otherwise GITHUB_TOKEN works for first publish /
      # packages with Actions write access.
      # Repo secret name: GHCR_PAT
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pterodactyl/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: If push was denied
        if: failure()
        run: |
          cat <<'EOF'
          Push failed. Build usually succeeds — GHCR rejected the upload (write_package).

          Fix (pick one):

          1) Link this repo to the package (keeps using GITHUB_TOKEN)
             https://github.com/users/MohFarzin/packages/container/omnix-streamrelay/settings
             → Manage Actions access → Add repository → Omnix-StreamRelay → Role: Write

          2) Or add a classic PAT as repo secret GHCR_PAT
             https://github.com/settings/tokens → classic → scopes: write:packages (and read:packages)
             Repo → Settings → Secrets and variables → Actions → New → GHCR_PAT
             Then re-run this workflow.

          Package must stay Public if Wings nodes pull without a login.
          EOF
